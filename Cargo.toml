[package]
name = "nbes"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
prost = "0.14.4"
prost-types = "0.14.4"
protoc-gen-prost = "0.5.0"
protoc-gen-tonic = "0.5.0"
rand = "0.10.1"
tokio = {version = "1.52.2", features = ["macros", "rt-multi-thread"]}
tokio-stream = {version = "0.1.18", features = ["sync"]}
tonic = { version = "0.14.6", features = ["tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14.6"
url = "2.5.8"
