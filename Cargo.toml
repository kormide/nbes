[package]
name = "nbes"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
prost = "0.14.3"
prost-types = "0.14.3"
protoc-gen-prost = "0.5.0"
protoc-gen-tonic = "0.5.0"
rand = "0.10.1"
ring = "0.17.14"
rustls = {version = "0.23.40"}
tokio = {version = "1.52.2", features = ["full"]}
tonic = {version = "0.14.5", features = ["transport", "tls-aws-lc", "tls-webpki-roots", "tls-native-roots", "gzip"]}
tonic-prost = "0.14.5"
url = "2.5.8"
